name: build

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - '*.txt'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - '*.txt'
      - '.gitignore'
  workflow_dispatch:

jobs:
  windows:
    name: Windows x86
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5

      # configures, builds, stamps the readme and zips into out/
      - name: Build and package
        shell: powershell
        run: .\build_release.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: jamme-windows-x86
          path: out/jamme-windows-x86.zip
          if-no-files-found: error

  linux:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get -qq update
          sudo apt-get install -y libsdl2-dev libmad0-dev zlib1g-dev libgl-dev

      - name: Configure
        run: cmake -S . -B out/release -DCMAKE_BUILD_TYPE=Release -DBuildCurl=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build
        run: cmake --build out/release --parallel

      # installs into the build/ release template
      - name: Install
        run: cmake --install out/release

      - name: Package
        working-directory: build
        run: |
          sed -i "s/Date: .*/Date: $(date +%d.%m.%Y)/; s/Revision: .*/Revision: $(git rev-parse --short HEAD)/" mme/readme.txt
          rm start_jaMME.cmd start_jaMME.command
          chmod +x jamme start_jaMME.sh
          tar -czf ../out/jamme-linux-x86_64.tar.gz *

      - uses: actions/upload-artifact@v4
        with:
          name: jamme-linux-x86_64
          path: out/jamme-linux-x86_64.tar.gz
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
            cmake_args: ''
          # arm64 disabled until its cgame build error is fixed
          # - arch: arm64
          #   runner: macos-15
          #   cmake_args: '-DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_SYSTEM_PROCESSOR=arm64'
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: brew install sdl2

      - name: Configure
        run: cmake -S . -B out/release -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5 ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build out/release --parallel

      # installs jamme.app (with the renderer inside) into the build/ release template
      - name: Install
        run: cmake --install out/release

      - name: Package
        working-directory: build
        run: |
          sed -i '' "s/Date: .*/Date: $(date +%d.%m.%Y)/; s/Revision: .*/Revision: $(git rev-parse --short HEAD)/" mme/readme.txt
          rm start_jaMME.cmd start_jaMME.sh
          chmod +x jamme.app/Contents/MacOS/jamme start_jaMME.command
          tar -czf ../out/jamme-macos-${{ matrix.arch }}.tar.gz *

      - uses: actions/upload-artifact@v4
        with:
          name: jamme-macos-${{ matrix.arch }}
          path: out/jamme-macos-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  # pushes to master replace the rolling "latest" pre-release,
  # v* tags get a permanent release of their own
  release:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')))
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List files
        run: ls -l dist

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "jaMME $GITHUB_REF_NAME" \
            --generate-notes

      - name: Publish latest build
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/* \
            --title "Latest build" \
            --notes "Automatic build of ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}." \
            --target "$GITHUB_SHA" \
            --prerelease
